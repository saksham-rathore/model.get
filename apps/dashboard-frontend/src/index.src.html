<!-- Tailwind (play CDN, pinned). For production, swap for a compiled build: npx tailwindcss -i in.css -o out.css --minify -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Bricolage Grotesque"', 'Geist', 'system-ui', 'sans-serif'],
          sans: ['Geist', 'system-ui', '-apple-system', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
          mono: ['"Geist Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace']
        },
        colors: {
          brand: { DEFAULT: '#6B93FF', strong: '#2757E8' },
          accent: '#2DD4BF',
          surface: '#0B0B0D',
          raised: '#121215'
        },
        keyframes: {
          rise: { from: { opacity: '0', transform: 'translateY(16px)' }, to: { opacity: '1', transform: 'none' } },
          marquee: { to: { transform: 'translateX(-50%)' } }
        },
        animation: {
          rise: 'rise .9s cubic-bezier(.2,.7,.2,1) both',
          marquee: 'marquee 46s linear infinite'
        }
      }
    }
  };
</script>
<style>
  /* Design tokens (single black theme) + the few things utilities can't express */
  :root {
    color-scheme: dark;
    --bg: #000000; --ink: #F4F4F5; --muted: #A1A1AA; --line: rgba(255,255,255,.1);
    --brand: #6B93FF; --accent: #2DD4BF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 84px); }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body { background: var(--bg); color: var(--ink); text-rendering: optimizeLegibility; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }

  /* Rolling subtitle word (used in hero.html, driven by routing-console.html) */
  .roll { position: relative; display: inline-block; vertical-align: top; height: 1.55em; line-height: 1.55; overflow: hidden; width: 3.7em; font-weight: 600; color: var(--brand); transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .roll::after { content: ""; position: absolute; left: 0; right: 0; top: 1.22em; height: 2px; background: var(--accent); border-radius: 2px; }
  .roll .w { position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0; transform: translateY(105%); transition: transform .55s cubic-bezier(.2,.8,.2,1), opacity .4s; }
  .roll .w.on { opacity: 1; transform: none; }
  .roll .w.prev { transform: translateY(-105%); }
  @media (prefers-reduced-motion: reduce) { .roll, .roll .w { transition: none; } }
</style>
</head>
